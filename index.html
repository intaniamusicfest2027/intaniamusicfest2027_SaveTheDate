<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>INTANIA MUSIC FEST 2027 · Save the Date</title>
  <meta name="description" content="28 มกราคม 2570 · 17:00–22:00 น. · ลานอินทาเนีย คณะวิศวกรรมศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย">
  <meta property="og:title" content="INTANIA MUSIC FEST 2027 · Save the Date">
  <meta property="og:description" content="28 มกราคม 2570 · 17:00–22:00 น. · เพิ่มลงปฏิทินของคุณ">
  <meta name="theme-color" content="#1a0305">
  <link rel="preload" as="image" href="background.png" fetchpriority="high">

  <!--
    วิธีแก้ไขหน้านี้
    - เปลี่ยนรูปพื้นหลัง  : แทนที่ไฟล์ background.png (ขนาด 1080x1920 px ควรเป็นอัตราส่วนเดียวกัน)
    - เปลี่ยนรูปปุ่ม      : แทนที่ btn-google-calendar.png และ btn-apple-calendar.png
    - เปลี่ยนตำแหน่งปุ่ม  : แก้ค่า --x --y --w --h ของ .btn-google / .btn-apple ใน CSS ด้านล่าง (หน่วยเป็นพิกเซลบนผืนผ้าใบ 1080x1920)
    - เปลี่ยนข้อมูลงาน    : แก้ลิงก์ Google Calendar ที่ปุ่มแรก และไฟล์ intania-music-fest-2027.ics สำหรับปุ่มที่สอง
  -->
  <style>
    :root {
      --canvas-w: 1080;   /* ความกว้างรูปพื้นหลังต้นฉบับ (px) */
      --canvas-h: 1920;   /* ความสูงรูปพื้นหลังต้นฉบับ (px) */
      --page-bg: #1a0305; /* สีขอบข้างเมื่อเปิดบนจอกว้าง (เดสก์ท็อป/แท็บเล็ต) */
    }

    * { box-sizing: border-box; }

    html { background: var(--page-bg); }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--page-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ความกว้างของผืนผ้าใบ: เต็มจอบนมือถือ / จำกัดตามความสูงบนจอกว้าง */
    :root { --stage-w: min(100vw, calc(100dvh * var(--canvas-w) / var(--canvas-h))); }

    /* ผืนผ้าใบอัตราส่วน 1080:1920 — ขยาย/หดตามหน้าจอ โดยไม่ crop และไม่บิดรูป */
    .stage {
      position: relative;
      flex: none;
      width: var(--stage-w);
      aspect-ratio: var(--canvas-w) / var(--canvas-h);
      background: url("background.png") center / 100% 100% no-repeat;
    }

    /* บนมือถือที่จอยาวกว่ารูป: ต่อขอบล่างของรูปลงไป แล้วค่อย ๆ มืดลง (ไม่แตะ/ไม่ยืดรูปพื้นหลัง) */
    .fill {
      flex: 1 0 0;
      width: var(--stage-w);
      background:
        linear-gradient(to bottom, rgba(26, 3, 5, 0) 0%, rgba(26, 3, 5, .55) 35%, var(--page-bg) 85%),
        url("edge-bottom.png") center / 100% 100% no-repeat;
    }

    /* ปุ่ม: วางตำแหน่งเป็นสัดส่วนของผืนผ้าใบ */
    .btn {
      position: absolute;
      display: block;
      left:   calc(var(--x) / var(--canvas-w) * 100%);
      top:    calc(var(--y) / var(--canvas-h) * 100%);
      width:  calc(var(--w) / var(--canvas-w) * 100%);
      height: calc(var(--h) / var(--canvas-h) * 100%);
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      transition: opacity .35s ease, transform .12s ease, filter .12s ease;
    }
    .ready .btn { opacity: 1; }
    .btn img {
      display: block;
      width: 100%;
      height: 100%;
      -webkit-user-drag: none;
      user-select: none;
    }
    /* ขยายพื้นที่กดให้กว้างขึ้นเล็กน้อยรอบปุ่ม (นิ้วกดง่ายขึ้น โดยไม่เปลี่ยนหน้าตา) */
    .btn::after {
      content: "";
      position: absolute;
      inset: -10px;
    }
    .btn:active { transform: scale(.97); filter: brightness(.92); }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; border-radius: 14px; }

    @media (hover: hover) {
      .btn:hover { transform: translateY(-2px); filter: brightness(1.04); }
    }

    /* พิกัดปุ่ม (px บนผืนผ้าใบ 1080x1920) */
    .btn-google { --x: 112; --y: 1261; --w: 852; --h: 122; }
    .btn-apple  { --x: 112; --y: 1499; --w: 857; --h: 122; }

    /* สำหรับโปรแกรมอ่านหน้าจอ */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
  </style>
  <noscript><style>.btn { opacity: 1; }</style></noscript>
  <script>
    // แสดงปุ่มหลังพื้นหลังโหลดเสร็จ (สำรอง 6 วินาที กันกรณีโหลดช้ามาก)
    (function () {
      var show = function () { document.documentElement.classList.add('ready'); };
      var img = new Image();
      img.onload = img.onerror = show;
      img.src = 'background.png';
      setTimeout(show, 6000);
    })();
  </script>
</head>
<body>
  <main class="stage" role="main" aria-label="INTANIA MUSIC FEST 2027 · 28 มกราคม 2570 · 17:00–22:00 น.">
    <h1 class="sr-only">INTANIA MUSIC FEST 2027 — 28 มกราคม 2570 (28 January 2027) เวลา 17:00–22:00 น. ณ ลานอินทาเนีย คณะวิศวกรรมศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย</h1>

    <!-- ปุ่ม Google Calendar: เปิดแอป/เว็บ Google Calendar พร้อมกรอกรายละเอียดกิจกรรมให้ -->
    <a class="btn btn-google"
       href="https://www.google.com/calendar/render?action=TEMPLATE&text=INTANIA%20MUSIC%20FEST%202027&dates=20270128T170000/20270128T220000&ctz=Asia/Bangkok&details=See%20you%20at%20INTANIA%20MUSIC%20FEST%202027!&location=Faculty%20of%20Engineering%2C%20Chulalongkorn%20University"
       target="_blank" rel="noopener"
       aria-label="Add to your Google Calendar">
      <img src="btn-google-calendar.png" alt="Add to your Google Calendar" width="852" height="122" draggable="false">
    </a>

    <!-- ปุ่ม Apple Calendar: เปิดไฟล์ .ics แล้ว iPhone/iPad/Mac จะขึ้นหน้าเพิ่มกิจกรรมลงปฏิทิน -->
    <a class="btn btn-apple"
       href="intania-music-fest-2027.ics"
       aria-label="Add to your Apple Calendar">
      <img src="btn-apple-calendar.png" alt="Add to your Apple Calendar" width="857" height="122" draggable="false">
    </a>
  </main>
  <div class="fill" aria-hidden="true"></div>
</body>
</html>
